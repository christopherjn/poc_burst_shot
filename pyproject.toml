[project]
name = "poc-burst-shot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "christopherjn", email = "christopherjn@phottam.ai" }
]
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0",
  "numpy>=1.26",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9",
  "hdbscan>=0.8",
  "opencv-python-headless>=4.9",
  "scikit-learn>=1.4",
]

[project.scripts]
poc-burst-shot = "poc_burst_shot:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
